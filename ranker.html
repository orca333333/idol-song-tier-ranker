<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Song Tier Ranker</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf5;color:#1d2140;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}main{width:min(1100px,calc(100% - 24px));margin:auto;padding:34px 0 60px}h1{margin:0;font-size:clamp(2rem,5vw,4.3rem);line-height:.9;letter-spacing:-.07em}b{color:#ff4d84}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin:20px 0}button{border:1px solid #e7e0df;border-radius:999px;background:#fff;color:#1d2140;padding:10px 14px;font:750 .88rem inherit;cursor:pointer}.hint{color:#6d6679;font-size:.9rem}.board{overflow:hidden;border:1px solid #e7e0df;border-radius:20px;background:#fff}.tier{display:grid;grid-template-columns:100px 1fr;min-height:104px;border-bottom:1px solid #e7e0df}.tier:last-child{border:0}.label{display:grid;place-items:center;color:#fff;font-size:2.4rem;font-weight:900}.S{background:#ff5a72}.A{background:#fbad50}.B{background:#f5d759}.C{background:#75c7a6}.D{background:#75b7e8}.zone{display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:12px;min-height:104px}.card{display:flex;align-items:center;min-height:38px;padding:7px 10px;border:1px solid #ede7e6;border-radius:9px;background:#fff7fa;box-shadow:0 2px #e4dddd;color:#363651;font-size:.8rem;font-weight:800;line-height:1.2;user-select:none;cursor:grab;touch-action:none}.dragging{opacity:.35}.pool{margin-top:16px;padding:14px;border:1px dashed #cfc3c1;border-radius:18px;background:#fff}.pool h2{margin:0 0 10px;font-size:1rem}.setup{max-width:600px;margin:8vh auto;padding:25px;border:1px solid #e7e0df;border-radius:20px;background:#fff}.setup label{display:grid;gap:7px;margin:14px 0;font-weight:800}.setup input,.setup textarea{width:100%;padding:10px;border:1px solid #e7e0df;border-radius:10px;font:inherit}.setup textarea{min-height:160px}@media(max-width:620px){main{width:calc(100% - 16px);padding-top:24px}.controls{justify-content:flex-start}.tier{grid-template-columns:56px 1fr}.label{font-size:1.65rem}.zone{gap:6px;padding:8px}.card{font-size:.74rem;min-height:35px;padding:6px 8px}}</style><main id="app"></main><script>const type=new URLSearchParams(location.search).get('artist')||'nonfic';const key='tier-'+type;const presets={chula:{name:'chuLa',songs:'ポポポポペット|トキメキCherry|トゥーザシャキナベイビーロンリファイト|涙色星|ちゃむあらん|史上最強うぇぽん|キミキミキミ|しゃなりら -五星ノ華 ゴセイノハナ-|青春ゾンビちゃん|ケ・セラ・セラ|Shooting STAR|閃光8|ビバ☆ジャパン|完全無敵あいうえお|サマーアモーレ|スッと君が消えていく感情|WAKU☆DOKIベイベー！|ちゅららんレーサー|ポケットの中で繋ぐ手と手|FIGHTING DREAMER|＃超ジャングルのチキチキアドべんちゃー|おちゅらけ戦隊ちゅらレンジャー|ギュッと溢れ出す愛情|We are the chuLa|ツラみ|SNOW SNOW SNOW|夏の君にテヘヘのヘ|どきゅーとこみゅにけーしょん|ぐるぐるぐるぐるりん地球|タランちゅら|シンガロング・ワールド|夢模様|全力ハリケーン|HERO☆ストラックアウト|DA・DA・DA・ダイスキ!!|プールサイドサマー|cross road|Pump it up!!|唯いchu無二のヒロイン|chuLa流キミ誕祭|ジュリセン☆ちゅら無双|ぶっとび!!ちゅらランチャー'.split('|')},ilife:{name:'iLiFE!',songs:'星色トラベラー|sweet timer|初恋リバイバル|Sleeping face|Quest×Quest|Dokkoi!ロマンティック|黄昏サイクル|青春のパズルは埋まらない|キラメキダイアリー|HUNGRY!!!|むげんだいすき|君セン！|可変三連MIXをおぼえる歌|Ride On!|アイドルライフスターターパック|Hands Up!|Shout of Joy|ヒラリラリア|会いにKiTE!|KiSEK!|ころころガール|ドラマチックミライ|ナイナイ恋煩い♡|アイドルライフブースターパック|サイクロンライフ！|のびしろグリッター|キスハグ侵略者！|#ラブコード|ガンバッテンダー|ライフステージ|デリバリサマー!!|アイドルライフエクストラパック|メッセージ|LOML|くりてぃかる♡ぷりちー|キュンとクラフト|ユメクライミング|完全勝利Love&Good！|メロメラ|BRAVE GROOVE|きゃわぽっぴんどぅー|アイドルライフメガパック|LiMiT STRiKER!|i REVOLUTION'.split('|')},nonfic:{name:'のんふぃく！ / 논픽!',songs:'ミラクルダンスを踊りたい|Honey Up RUSH!!|ふゅーちゃーちゅぅな〜！|Palette|レイトショー|ビリビリラブゲーム|てっぺんコード|禁制ヒロインサバイバル|奇跡的 無敵 キラメキ ランデブー|Day by day|ちゅきらぶ！|ぷろふぃ〜る|全人類あいうぉんちゅー|プラトニックチョロイン|おんりーびーと！|ツヨカワ|一方通行ステップアップ|NonFiction|ストラテジー|年中無休エンジョイ宣言|GiveME☆Summer|I LOVE YOU＝NONFICTION|キミノヒーロー|らぶげっちゅ|絶対優勝！おぎゃりマスター|ルンルンパーティー日常|ひっぱれ大団円|ノーテンキ超キュートガール|はなまるフュージョン|アイリス|うれぴっぴ！|よくばりバイキング'.split('|')}};const app=document.getElementById('app');let data;try{data=JSON.parse(localStorage.getItem(key))}catch(e){}if(!data&&type!=='custom')data=presets[type]||presets.nonfic;const save=()=>localStorage.setItem(key,JSON.stringify(data));const esc=s=>s.replace(/[&<>]/g,c=>c==='&'?'&amp;':c==='<'?'&lt;':'&gt;');function move(zone,card,x,y){let list=[...zone.querySelectorAll('.card:not(.dragging)')],before=list.find(e=>{let r=e.getBoundingClientRect();return y<r.top+r.height/2||(y>=r.top&&y<=r.bottom&&x<r.left+r.width/2)});zone.insertBefore(card,before||null)}function paint(){if(!data){app.innerHTML='<section class="setup"><h1><b>SONG</b><br>TIER RANKER</h1><p>나만의 가수표를 처음부터 만드세요.</p><label>가수 이름<input id="name" placeholder="예: 내가 좋아하는 가수"></label><label>곡 목록<textarea id="songs" placeholder="한 줄에 한 곡"></textarea></label><button id="go">랭킹표 만들기</button></section>';document.getElementById('go').onclick=()=>{let n=document.getElementById('name').value.trim(),s=document.getElementById('songs').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!n||!s.length)return alert('가수명과 곡을 입력해 주세요.');data={name:n,songs:s};save();paint()};return}let cards=data.songs.map((s,i)=>'<div class="card" draggable="true" data-id="'+i+'">'+esc(s)+'</div>').join('');app.innerHTML='<h1><b>SONG</b><br>TIER RANKER</h1><p class="hint">'+esc(data.name)+' · PC와 모바일 모두 드래그해 티어를 정하고, 같은 티어 안에서도 순서를 바꿀 수 있어요.</p><div class="controls"><button id="set">설정</button><button id="add">곡 추가</button><button id="mix">섞기</button><button id="reset">티어 초기화</button>'+(type==='custom'?'<button id="again">처음부터 만들기</button>':'')+'</div><section class="board">'+['S','A','B','C','D'].map(t=>'<div class="tier"><div class="label '+t+'">'+t+'</div><div class="zone"></div></div>').join('')+'</section><section class="pool"><h2>미정</h2><div class="zone">'+cards+'</div></section>';wire()}function wire(){let held;document.querySelectorAll('.card').forEach(c=>{c.ondragstart=e=>{held=c;c.classList.add('dragging');e.dataTransfer.effectAllowed='move'};c.ondragend=()=>{c.classList.remove('dragging');held=null;save()};c.onpointerdown=e=>{if(e.pointerType==='mouse')return;let sx=e.clientX,sy=e.clientY,on=false;let mv=v=>{if(Math.hypot(v.clientX-sx,v.clientY-sy)>7)on=true;if(!on)return;c.classList.add('dragging');c.style.pointerEvents='none';let z=document.elementFromPoint(v.clientX,v.clientY);z=z&&z.closest('.zone');if(z)move(z,c,v.clientX,v.clientY)};let up=()=>{c.classList.remove('dragging');c.style.pointerEvents='';window.removeEventListener('pointermove',mv);save()};window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up,{once:true})}});document.querySelectorAll('.zone').forEach(z=>{z.ondragover=e=>{e.preventDefault();if(held)move(z,held,e.clientX,e.clientY)};z.ondrop=e=>{e.preventDefault();if(held){move(z,held,e.clientX,e.clientY);save()}}});document.getElementById('set').onclick=()=>{let n=prompt('가수 이름',data.name);if(n&&n.trim()){data.name=n.trim();save();paint()}};document.getElementById('add').onclick=()=>{let s=prompt('추가할 곡을 한 줄씩 입력하세요.');if(s){data.songs.push(...s.split('\n').map(x=>x.trim()).filter(Boolean));save();paint()}};document.getElementById('mix').onclick=()=>{let z=document.querySelector('.pool .zone');[...z.children].sort(()=>Math.random()-.5).forEach(c=>z.append(c))};document.getElementById('reset').onclick=()=>{if(confirm('모든 곡을 미정으로 옮길까요?')){let z=document.querySelector('.pool .zone');document.querySelectorAll('.card').forEach(c=>z.append(c))}};let a=document.getElementById('again');if(a)a.onclick=()=>{if(confirm('가수 설정부터 새로 시작할까요?')){localStorage.removeItem(key);data=null;paint()}}}paint()</script>
