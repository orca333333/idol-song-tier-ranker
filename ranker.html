<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:system-ui;background:#faf8ff;color:#25233e}main{max-width:900px;margin:auto;padding:22px}.row{display:grid;grid-template-columns:60px 1fr;min-height:90px;border-bottom:1px solid #ddd;background:#fff}.tag{display:grid;place-items:center;color:#fff;font-size:28px;font-weight:900}.S{background:#7567eb}.A{background:#e979b0}.B{background:#f4b64d}.C{background:#6bc8b5}.D{background:#79aee8}.zone{padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}.card{padding:8px 10px;border-radius:9px;background:#f4f3fb;font-size:13px;font-weight:700;touch-action:none;user-select:none}.pool{margin-top:14px;border:1px dashed #bbb;padding:10px}button,input,textarea{font:inherit;padding:9px;border-radius:8px;border:1px solid #ccc}textarea{width:100%;min-height:130px}@media(max-width:600px){main{padding:12px}.row{grid-template-columns:48px 1fr;min-height:84px}.tag{font-size:22px}.card{min-height:38px;font-size:12px}}</style><main id="ui"></main><script>const q=new URLSearchParams(location.search),a=q.get('artist');if(a==='chula')location.replace('chuLa_티어랭커.html');if(a==='ilife')location.replace('iLiFE_티어랭커.html');const nf='ミラクルダンスを踊りたい|Honey Up RUSH!!|ふゅーちゃーちゅぅな〜！|Palette|レイトショー|ビリビリラブゲーム|てっぺんコード|禁制ヒロインサバイバル|奇跡的 無敵 キラメキ ランデブー|Day by day|ちゅきらぶ！|ぷろふぃ〜る|全人類あいうぉんちゅー|プラトニックチョロイン|おんりーびーと！|ツヨカワ|一方通行ステップアップ|NonFiction|ストラテジー|年中無休エンジョイ宣言|GiveME☆Summer|I LOVE YOU＝NONFICTION|キミノヒーロー|らぶげっちゅ|絶対優勝！おぎゃりマスター|ルンルンパーティー日常|ひっぱれ大団円|ノーテンキ超キュートガール|はなまるフュージョン|アイリス|うれぴっぴ！|よくばりバイキング'.split('|');let cfg=a==='custom'?JSON.parse(localStorage.getItem('custom-ranker')||'null'):{name:'のんふぃく！ / 논픽!',songs:nf};if(!cfg){ui.innerHTML='<h1>커스텀 가수표 만들기</h1><input id="n" placeholder="가수 이름"><p><textarea id="s" placeholder="한 줄에 한 곡씩 입력"></textarea></p><button id="go">만들기</button>';go.onclick=()=>{let x=s.value.split('\n').map(v=>v.trim()).filter(Boolean);if(n.value.trim()&&x.length){localStorage.setItem('custom-ranker',JSON.stringify({name:n.value.trim(),songs:x}));location.reload()}}}else{let songs=[...cfg.songs],drag,touch;ui.innerHTML='<h1>'+cfg.name+' SONG RANKER</h1><p>모바일에서는 카드를 누른 채 움직이세요. <button id="add">곡 추가</button></p><section id="board"></section><section class="pool"><b>아직 고르지 않음</b><div class="zone" id="pool"></div></section>';let zones=[];['S','A','B','C','D'].forEach(t=>{let r=document.createElement('div');r.className='row';r.innerHTML='<div class="tag '+t+'">'+t+'</div><div class="zone"></div>';board.append(r);zones.push(r.lastChild)});zones.push(pool);function card(x){let e=document.createElement('div');e.className='card';e.textContent=x;e.draggable=true;e.ondragstart=()=>drag=e;e.onpointerdown=v=>{if(v.pointerType!=='mouse')touch={e,id:v.pointerId,x:v.clientX,y:v.clientY}};return e}songs.forEach(x=>pool.append(card(x)));zones.forEach(z=>z.ondragover=e=>{e.preventDefault();z.append(drag)});document.addEventListener('pointermove',e=>{if(!touch||e.pointerId!==touch.id)return;if(Math.hypot(e.clientX-touch.x,e.clientY-touch.y)<7)return;touch.e.style.pointerEvents='none';let z=document.elementFromPoint(e.clientX,e.clientY)?.closest('.zone');if(z)z.append(touch.e)},{passive:false});document.addEventListener('pointerup',e=>{if(touch&&e.pointerId===touch.id){touch.e.style.pointerEvents='';touch=null}});add.onclick=()=>{let x=prompt('추가할 곡명 (여러 곡은 줄바꿈)');if(x)x.split('\n').map(v=>v.trim()).filter(Boolean).forEach(v=>pool.append(card(v)))}};</script>
