<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Song Tier Ranker</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8ff;color:#25233e;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}main{width:min(1100px,calc(100% - 20px));margin:auto;padding:28px 0 55px}h1{font-size:clamp(2rem,8vw,4rem);line-height:.9;margin:0}h1 b{color:#7162e8}header{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:20px}.controls{display:flex;gap:7px;flex-wrap:wrap;justify-content:end}button{padding:10px 13px;border:1px solid #dedbea;background:#fff;border-radius:999px;font-weight:800;color:inherit;touch-action:manipulation}.hint{font-size:.9rem;color:#6d6983}.board{border:1px solid #dedbea;border-radius:18px;overflow:hidden;background:#fff}.tier{display:grid;grid-template-columns:105px 1fr;min-height:105px;border-bottom:1px solid #dedbea}.tier:last-child{border:0}.label{display:grid;place-items:center;color:#fff;font-size:2.4rem;font-weight:900}.S{background:#7567eb}.A{background:#ed7ead}.B{background:#efb84d}.C{background:#67bfae}.D{background:#7ba8e3}.zone{display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:12px;min-height:105px}.card{padding:8px 11px;background:#f7f6fc;border:1px solid #e4e1ee;border-radius:9px;font-size:.8rem;font-weight:750;cursor:grab;user-select:none;touch-action:none}.dragging{opacity:.3}.pool{margin-top:15px;padding:14px;border:1px dashed #c7c2d5;border-radius:17px;background:#fff}.pool h2{font-size:1rem;margin:0 0 10px}dialog{width:min(460px,calc(100% - 28px));border:0;border-radius:18px;padding:20px}textarea,input{width:100%;padding:10px;border:1px solid #d9d5e6;border-radius:9px;font:inherit}textarea{min-height:130px}.setup{max-width:600px;margin:9vh auto;background:#fff;padding:25px;border:1px solid #dedbea;border-radius:20px}.setup label{display:grid;gap:6px;margin:15px 0;font-weight:800}@media(max-width:650px){header{display:block}.controls{margin-top:16px}.controls button{flex:1 1 calc(50% - 7px);min-height:44px}.tier{grid-template-columns:55px 1fr;min-height:92px}.label{font-size:1.7rem}.zone{min-height:92px;padding:8px;gap:6px}.card{min-height:38px;font-size:.75rem}.hint{line-height:1.5}}</style><main id="setup" class="setup" hidden><h1>나만의<br><b>가수표</b> 만들기</h1><p>가수와 곡을 한 줄에 하나씩 입력하세요.</p><label>가수 이름<input id="artist" placeholder="예: CANDY TUNE"></label><label>곡 목록<textarea id="songlist" placeholder="곡명 1&#10;곡명 2"></textarea></label><button id="make">티어표 만들기</button></main><main id="app" hidden><header><div><h1 id="title"></h1><p id="sub"></p></div><div class="controls"><button id="add">곡 추가</button><button id="shuffle">곡 섞기</button><button id="reset">전체 초기화</button></div></header><p class="hint">카드를 드래그해 S–D 티어에 놓으세요. 모바일에서는 카드를 꾹 누른 채 움직이면 됩니다.</p><section class="board"><div class="tier"><div class="label S">S</div><div class="zone" data="S"></div></div><div class="tier"><div class="label A">A</div><div class="zone" data="A"></div></div><div class="tier"><div class="label B">B</div><div class="zone" data="B"></div></div><div class="tier"><div class="label C">C</div><div class="zone" data="C"></div></div><div class="tier"><div class="label D">D</div><div class="zone" data="D"></div></div></section><section class="pool"><h2>아직 고르지 않음 <small id="count"></small></h2><div class="zone" data="pool" id="pool"></div></section></main><dialog id="dialog"><form method="dialog"><h2>곡 추가</h2><p>한 줄에 한 곡씩 입력하세요.</p><textarea id="more"></textarea><p><button>취소</button> <button id="addok" value="default">추가</button></p></form></dialog><script>const sets={chula:{n:'chuLa',s:'ポポポポペット|トキメキCherry|トゥーザシャキナベイビーロンリファイト|涙色星|ちゃむあらん|史上最強うぇぽん|キミキミキミ|しゃなりら -五星ノ華 ゴセイノハナ-|青春ゾンビちゃん|ケ・セラ・セラ|Shooting STAR|閃光8|ビバ☆ジャパン|完全無敵あいうえお|サマーアモーレ|スッと君が消えていく感情|WAKU☆DOKIベイベー！|ちゅららんレーサー|ポケットの中で繋ぐ手と手|FIGHTING DREAMER|＃超ジャングルのチキチキアドべんちゃー|おちゅらけ戦隊ちゅらレンジャー|ギュッと溢れ出す愛情|We are the chuLa|ツラみ|SNOW SNOW SNOW|夏の君にテヘヘのヘ|どきゅーとこみゅにけーしょん|ぐるぐるぐるぐるりん地球|タランちゅら|シンガロング・ワールド|夢模様|全力ハリケーン|HERO☆ストラックアウト|DA・DA・DA・ダイスキ!!|プールサイドサマー|cross road|Pump it up!!|唯いchu無二のヒロイン|chuLa流キミ誕祭|ジュリセン☆ちゅら無双|ぶっとび!!ちゅらランチャー'},ilife:{n:'iLiFE!',s:'星色トラベラー|sweet timer|初恋リバイバル|Sleeping face|Quest×Quest|Dokkoi!ロマンティック|黄昏サイクル|青春のパズルは埋まらない|キラメキダイアリー|HUNGRY!!!|むげんだいすき|君セン！|可変三連MIXをおぼえる歌|Ride On!|アイドルライフスターターパック|Hands Up!|Shout of Joy|ヒラリラリア|会いにKiTE!|KiSEK!|ころころガール|ドラマチックミライ|ナイナイ恋煩い♡|アイドルライフブースターパック|サイクロンライフ！|のびしろグリッター|キスハグ侵略者！|#ラブコード|ガンバッテンダー|ライフステージ|デリバリサマー!!|アイドルライフエクストラパック|メッセージ|LOML|くりてぃかる♡ぷりちー|キュンとクラフト|ユメクライミング|完全勝利Love&Good！|メロメラ|BRAVE GROOVE|きゃわぽっぴんどぅー|アイドルライフメガパック|LiMiT STRiKER!|i REVOLUTION'},nonfic:{n:'のんふぃく！',s:'ミラクルダンスを踊りたい|Honey Up RUSH!!|ふゅーちゃーちゅぅな〜！|Palette|レイトショー|ビリビリラブゲーム|てっぺんコード|禁制ヒロインサバイバル|奇跡的 無敵 キラメキ ランデブー|Day by day|ちゅきらぶ！|ぷろふぃ〜る|全人類あいうぉんちゅー|プラトニックチョロイン|おんりーびーと！|ツヨカワ|一方通行ステップアップ|NonFiction|ストラテジー|年中無休エンジョイ宣言|GiveME☆Summer|I LOVE YOU＝NONFICTION|キミノヒーロー|らぶげっちゅ|絶対優勝！おぎゃりマスター|ルンルンパーティー日常|ひっぱれ大団円|ノーテンキ超キュートガール|はなまるフュージョン|アイリス|うれぴっぴ！|よくばりバイキング'}};let q=new URLSearchParams(location.search),id=q.get('artist'),cfg=id==='custom'?JSON.parse(localStorage.getItem('customRanker')||'null'):sets[id],songs=[],drag,touch,zones=[...document.querySelectorAll('.zone')];function start(c){c.draggable=true;c.className='card';c.textContent=c.dataset.song;c.ondragstart=()=>drag=c;c.onpointerdown=e=>{if(e.pointerType!=='mouse')touch={c,id:e.pointerId,x:e.clientX,y:e.clientY,a:false}};return c}function card(n){let c=document.createElement('div');c.dataset.song=n;return start(c)}function save(){localStorage.setItem('rank-'+(id||'custom'),JSON.stringify(Object.fromEntries(zones.map(z=>[z.dataset,[...z.children].map(c=>c.dataset.song)])));count.textContent='('+pool.children.length+'곡)'}function render(data={}){zones.forEach(z=>z.replaceChildren());let used=new Set(Object.values(data).flat());zones.forEach(z=>(data[z.dataset]||[]).forEach(n=>z.append(card(n))));songs.filter(n=>!used.has(n)).forEach(n=>pool.append(card(n)));save()}function init(){if(!cfg)return;setup.hidden=true;app.hidden=false;songs=cfg.s.split?cfg.s.split('|'):cfg.s;title.innerHTML=cfg.n+' <b>SONG</b><br>RANKER';sub.textContent='나만의 '+cfg.n+' 최애곡 티어표.';try{render(JSON.parse(localStorage.getItem('rank-'+id))||{})}catch{render()}}zones.forEach(z=>{z.ondragover=e=>{e.preventDefault();z.append(drag);save()}});document.addEventListener('pointermove',e=>{if(!touch||e.pointerId!==touch.id)return;if(!touch.a&&Math.hypot(e.clientX-touch.x,e.clientY-touch.y)<7)return;touch.a=true;touch.c.classList.add('dragging');touch.c.style.pointerEvents='none';let z=document.elementFromPoint(e.clientX,e.clientY)?.closest('.zone');if(z)z.append(touch.c)},{passive:false});document.addEventListener('pointerup',e=>{if(touch&&e.pointerId===touch.id){touch.c.classList.remove('dragging');touch.c.style.pointerEvents='';touch=null;save()}});add.onclick=()=>dialog.showModal();addok.onclick=e=>{let a=[...new Set(more.value.split('\n').map(x=>x.trim()).filter(Boolean))].filter(x=>!songs.includes(x));if(!a.length){e.preventDefault();return}songs.push(...a);a.forEach(x=>pool.append(card(x)));cfg.s=songs;id==='custom'&&localStorage.setItem('customRanker',JSON.stringify(cfg));save()};shuffle.onclick=()=>render({pool:[...songs].sort(()=>Math.random()-.5)});reset.onclick=()=>render();make.onclick=()=>{let n=artist.value.trim(),s=songlist.value.split('\n').map(x=>x.trim()).filter(Boolean);if(!n||!s.length)return;localStorage.setItem('customRanker',JSON.stringify({n,s}));location.search='artist=custom'};if(id==='custom'&&!cfg){setup.hidden=false}else init();</script></html>
