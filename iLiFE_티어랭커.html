<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iLiFE! · Song Tier Ranker</title><style>
*{box-sizing:border-box}body{margin:0;min-width:320px;color:#17203f;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;background:radial-gradient(circle at 9% 4%,#dce8ff 0 8%,transparent 27%),radial-gradient(circle at 90% 10%,#ffe0f0 0 7%,transparent 26%),#f9fbff}main{width:min(1180px,calc(100% - 32px));margin:auto;padding:48px 0 70px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}h1{margin:0;font-size:clamp(2rem,5vw,4.6rem);line-height:.9;letter-spacing:-.075em}h1 b{color:#7567eb}.sub{margin:13px 0 0;font-weight:650;opacity:.65}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:end}button{border:1px solid #dfe3ed;border-radius:999px;background:#fff;color:#17203f;padding:10px 15px;font:750 .88rem inherit;cursor:pointer}button:hover{background:#f0efff}.hint{margin:0 0 12px;font-size:.9rem;font-weight:700;opacity:.65}.hint i{display:inline-block;width:9px;height:9px;background:#7567eb;border-radius:50%;margin-right:7px}.board{overflow:hidden;border:1px solid #dfe3ed;border-radius:22px;background:#fff;box-shadow:0 18px 50px #25346413}.tier{display:grid;grid-template-columns:112px 1fr;min-height:112px;border-bottom:1px solid #dfe3ed}.tier:last-child{border:0}.label{display:grid;place-items:center;color:#fff;font-size:2.5rem;font-weight:900;letter-spacing:-.1em;text-shadow:0 2px #0002}.s{background:#7968ee}.a{background:#e979b0}.b{background:#f4b64d}.c{background:#6bc8b5}.d{background:#79aee8}.zone{display:flex;flex-wrap:wrap;align-content:flex-start;gap:9px;padding:14px;min-height:112px;transition:.15s}.zone.over{background:#f2f0ff;outline:3px dashed #a99eff;outline-offset:-8px}.card{display:flex;align-items:center;max-width:100%;min-height:39px;padding:8px 12px;border:1px solid #e5e7f0;border-radius:10px;background:linear-gradient(135deg,#fff,#f7f7ff);box-shadow:0 3px #dadde8;color:#343959;font-size:.82rem;font-weight:800;line-height:1.2;cursor:grab;user-select:none}.card:active{cursor:grabbing}.dragging{opacity:.32}.unranked{margin-top:20px;padding:18px;border:1px dashed #c4c9d7;border-radius:20px;background:#ffffffa8}.unranked h2{margin:0 0 12px;font-size:1rem}.unranked small{opacity:.55}#pool{min-height:50px}footer{margin-top:18px;color:#777b94;font-size:.78rem;text-align:center}@media(max-width:650px){main{width:calc(100% - 20px);padding-top:27px}header{display:block}.controls{justify-content:start;margin-top:18px}.tier{grid-template-columns:67px 1fr;min-height:100px}.label{font-size:2rem}.zone{min-height:100px;gap:7px;padding:10px}.card{min-height:35px;padding:7px 9px;font-size:.75rem}}
</style></head><body><main><header><div><h1>iLiFE! <b>SONG</b><br>RANKER</h1><p class="sub">나만의 iLiFE! 최애곡 티어표.</p></div><div class="controls"><button id="export">JPG로 저장</button><button id="shuffle">곡 섞기</button><button id="reset">전체 초기화</button></div></header><p class="hint"><i></i>곡 카드를 드래그해서 S–D 랭크에 놓아보세요. 배치는 이 브라우저에 자동 저장됩니다.</p><section class="board" aria-label="iLiFE! 곡 티어표"><div class="tier"><div class="label s">S</div><div class="zone" data-tier="S"></div></div><div class="tier"><div class="label a">A</div><div class="zone" data-tier="A"></div></div><div class="tier"><div class="label b">B</div><div class="zone" data-tier="B"></div></div><div class="tier"><div class="label c">C</div><div class="zone" data-tier="C"></div></div><div class="tier"><div class="label d">D</div><div class="zone" data-tier="D"></div></div></section><section class="unranked"><h2>아직 고르지 않음 <small id="count"></small></h2><div id="pool" class="zone" data-tier="pool"></div></section><footer>iLiFE! · 44 group songs · 카드 순서도 자유롭게 변경할 수 있어요.</footer></main><script>
const songs=['星色トラベラー','sweet timer','初恋リバイバル','Sleeping face','Quest×Quest','Dokkoi!ロマンティック','黄昏サイクル','青春のパズルは埋まらない','キラメキダイアリー','HUNGRY!!!','むげんだいすき','君セン！','可変三連MIXをおぼえる歌','Ride On!','アイドルライフスターターパック','Hands Up!','Shout of Joy','ヒラリラリア','会いにKiTE!','KiSEK!','ころころガール','ドラマチックミライ','ナイナイ恋煩い♡','アイドルライフブースターパック','サイクロンライフ！','のびしろグリッター','キスハグ侵略者！','#ラブコード','ガンバッテンダー','ライフステージ','デリバリサマー!!','アイドルライフエクストラパック','メッセージ','LOML','くりてぃかる♡ぷりちー','キュンとクラフト','ユメクライミング','完全勝利Love&Good！','メロメラ','BRAVE GROOVE','きゃわぽっぴんどぅー','アイドルライフメガパック','LiMiT STRiKER!','i REVOLUTION'];
const key='ilife-tier-ranker-v1',pool=document.querySelector('#pool'),zones=[...document.querySelectorAll('.zone')];let dragging;function make(name){let e=document.createElement('div');e.className='card';e.draggable=true;e.textContent=name;e.dataset.song=name;e.ondragstart=()=>{dragging=e;requestAnimationFrame(()=>e.classList.add('dragging'))};e.ondragend=()=>{e.classList.remove('dragging');zones.forEach(z=>z.classList.remove('over'));save()};return e}function before(zone,x,y){return[...zone.querySelectorAll('.card:not(.dragging)')].find(e=>{let r=e.getBoundingClientRect();return y<r.top+r.height/2||(y<r.bottom&&x<r.left+r.width/2)})}function save(){let d={};zones.forEach(z=>d[z.dataset.tier]=[...z.children].map(e=>e.dataset.song));localStorage.setItem(key,JSON.stringify(d));document.querySelector('#count').textContent=`(${pool.children.length}곡)`}function render(data={}){zones.forEach(z=>z.replaceChildren());let used=new Set(Object.values(data).flat());zones.forEach(z=>(data[z.dataset.tier]||[]).forEach(n=>z.append(make(n))));songs.filter(n=>!used.has(n)).forEach(n=>pool.append(make(n)));save()}function exportJpg(){const c=document.createElement('canvas'),x=c.getContext('2d'),w=1600,lw=155,px=22,rows=[];x.font='700 22px Arial';for(const z of zones.filter(z=>z.dataset.tier!=='pool')){let line=[],lines=[line],used=0;for(const e of z.children){const text=e.dataset.song,tw=Math.min(x.measureText(text).width+px*2,500);if(used+tw>w-lw-40&&line.length){line=[];lines.push(line);used=0}line.push([text,tw]);used+=tw+10}rows.push([z.dataset.tier,lines,Math.max(128,lines.length*56+34)])}const h=165+rows.reduce((n,r)=>n+r[2],0)+55;c.width=w;c.height=h;x.fillStyle='#f9fbff';x.fillRect(0,0,w,h);x.fillStyle='#17203f';x.font='900 65px Arial';x.fillText('iLiFE! SONG RANKER',54,82);x.fillStyle='#7567eb';x.font='700 25px Arial';x.fillText('MY PERSONAL TIER LIST',56,120);let y=165,colors={S:'#7968ee',A:'#e979b0',B:'#f4b64d',C:'#6bc8b5',D:'#79aee8'};for(const [tier,lines,rh] of rows){x.fillStyle='#fff';x.fillRect(0,y,w,rh);x.fillStyle=colors[tier];x.fillRect(0,y,lw,rh);x.fillStyle='#fff';x.font='900 55px Arial';x.fillText(tier,54,y+rh/2+19);let cy=y+22;for(const line of lines){let cx=lw+20;for(const [text,tw] of line){x.fillStyle='#f2f2fa';x.fillRect(cx,cy,tw,38);x.fillStyle='#343959';x.font='700 20px Arial';x.fillText(text,cx+px,cy+26);cx+=tw+10}cy+=56}y+=rh}x.fillStyle='#777b94';x.font='18px Arial';x.fillText('Made with iLiFE! Song Ranker',54,h-22);const a=document.createElement('a');a.download='iLiFE_티어표.jpg';a.href=c.toDataURL('image/jpeg',.94);a.click()}zones.forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add('over');if(!dragging)return;let b=before(z,e.clientX,e.clientY);b?z.insertBefore(dragging,b):z.append(dragging)};z.ondragleave=e=>{if(!z.contains(e.relatedTarget))z.classList.remove('over')};z.ondrop=e=>{e.preventDefault();z.classList.remove('over');save()}});document.querySelector('#reset').onclick=()=>{localStorage.removeItem(key);render()};document.querySelector('#shuffle').onclick=()=>render({pool:[...songs].sort(()=>Math.random()-.5)});document.querySelector('#export').onclick=exportJpg;try{render(JSON.parse(localStorage.getItem(key))||{})}catch{render()}
</script></body></html>
