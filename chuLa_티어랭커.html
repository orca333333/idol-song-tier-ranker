<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>chuLa · Song Tier Ranker</title>
<style>
*{box-sizing:border-box}body{margin:0;min-width:320px;color:#1d2140;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;background:radial-gradient(circle at 10% 5%,#ffd8e5 0 8%,transparent 27%),radial-gradient(circle at 90% 10%,#ddd6ff 0 7%,transparent 26%),#fffaf5}main{width:min(1180px,calc(100% - 32px));margin:auto;padding:48px 0 70px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}h1{margin:0;font-size:clamp(2rem,5vw,4.6rem);line-height:.9;letter-spacing:-.075em}h1 b{color:#ff4d84}.sub{margin:13px 0 0;font-weight:650;opacity:.65}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:end}button{border:1px solid #e7e0df;border-radius:999px;background:#fff;color:#1d2140;padding:10px 15px;font:750 .88rem inherit;cursor:pointer}button:hover{background:#fff0f5}.hint{margin:0 0 12px;font-size:.9rem;font-weight:700;opacity:.65}.hint i{display:inline-block;width:9px;height:9px;background:#ff4d84;border-radius:50%;margin-right:7px}.board{overflow:hidden;border:1px solid #e7e0df;border-radius:22px;background:#fff;box-shadow:0 18px 50px #40214413}.tier{display:grid;grid-template-columns:112px 1fr;min-height:112px;border-bottom:1px solid #e7e0df}.tier:last-child{border:0}.label{display:grid;place-items:center;color:#fff;font-size:2.5rem;font-weight:900;letter-spacing:-.1em;text-shadow:0 2px #0002}.s{background:#ff5a72}.a{background:#fbad50}.b{background:#f5d759}.c{background:#75c7a6}.d{background:#75b7e8}.zone{display:flex;flex-wrap:wrap;align-content:flex-start;gap:9px;padding:14px;min-height:112px;transition:.15s}.zone.over{background:#fff0f5;outline:3px dashed #ff8eaf;outline-offset:-8px}.card{display:flex;align-items:center;max-width:100%;min-height:39px;padding:8px 12px;border:1px solid #ede7e6;border-radius:10px;background:linear-gradient(135deg,#fff,#fff7fa);box-shadow:0 3px #e4dddd;color:#363651;font-size:.82rem;font-weight:800;line-height:1.2;cursor:grab;user-select:none}.card:active{cursor:grabbing}.dragging{opacity:.32}.unranked{margin-top:20px;padding:18px;border:1px dashed #cfc3c1;border-radius:20px;background:#ffffffa8}.unranked h2{margin:0 0 12px;font-size:1rem}.unranked small{opacity:.55}#pool{min-height:50px}footer{margin-top:18px;color:#777286;font-size:.78rem;text-align:center}@media(max-width:650px){main{width:calc(100% - 20px);padding-top:27px}header{display:block}.controls{justify-content:start;margin-top:18px}.tier{grid-template-columns:67px 1fr;min-height:100px}.label{font-size:2rem}.zone{min-height:100px;gap:7px;padding:10px}.card{min-height:35px;padding:7px 9px;font-size:.75rem}}
</style>
</head>
<body><main>
<header><div><h1>chuLa <b>SONG</b><br>RANKER</h1><p class="sub">마음 가는 대로, 나만의 chuLa 티어표.</p></div><div class="controls"><button id="export">JPG로 저장</button><button id="shuffle">곡 섞기</button><button id="reset">전체 초기화</button></div></header>
<p class="hint"><i></i>곡 카드를 드래그해서 S–D 랭크에 놓아보세요. 배치는 이 브라우저에 자동 저장됩니다.</p>
<section class="board" aria-label="chuLa 곡 티어표"><div class="tier"><div class="label s">S</div><div class="zone" data-tier="S"></div></div><div class="tier"><div class="label a">A</div><div class="zone" data-tier="A"></div></div><div class="tier"><div class="label b">B</div><div class="zone" data-tier="B"></div></div><div class="tier"><div class="label c">C</div><div class="zone" data-tier="C"></div></div><div class="tier"><div class="label d">D</div><div class="zone" data-tier="D"></div></div></section>
<section class="unranked"><h2>아직 고르지 않음 <small id="count"></small></h2><div id="pool" class="zone" data-tier="pool"></div></section><footer>chuLa · 42 songs · 카드 순서도 자유롭게 변경할 수 있어요.</footer>
</main><script>
const songs=['ポポポポペット','トキメキCherry','トゥーザシャキナベイビーロンリファイト','涙色星','ちゃむあらん','史上最強うぇぽん','キミキミキミ','しゃなりら -五星ノ華 ゴセイノハナ-','青春ゾンビちゃん','ケ・セラ・セラ','Shooting STAR','閃光8','ビバ☆ジャパン','完全無敵あいうえお','サマーアモーレ','スッと君が消えていく感情','WAKU☆DOKIベイベー！','ちゅららんレーサー','ポケットの中で繋ぐ手と手','FIGHTING DREAMER','＃超ジャングルのチキチキアドべんちゃー','おちゅらけ戦隊ちゅらレンジャー','ギュッと溢れ出す愛情','We are the chuLa','ツラみ','SNOW SNOW SNOW','夏の君にテヘヘのヘ','どきゅーとこみゅにけーしょん','ぐるぐるぐるぐるりん地球','タランちゅら','シンガロング・ワールド','夢模様','全力ハリケーン','HERO☆ストラックアウト','DA・DA・DA・ダイスキ!!','プールサイドサマー','cross road','Pump it up!!','唯いchu無二のヒロイン','chuLa流キミ誕祭','ジュリセン☆ちゅら無双','ぶっとび!!ちゅらランチャー'];
const key='chula-tier-ranker-v1',pool=document.querySelector('#pool'),zones=[...document.querySelectorAll('.zone')];let dragging;
function make(name){let e=document.createElement('div');e.className='card';e.draggable=true;e.textContent=name;e.dataset.song=name;e.ondragstart=()=>{dragging=e;requestAnimationFrame(()=>e.classList.add('dragging'))};e.ondragend=()=>{e.classList.remove('dragging');zones.forEach(z=>z.classList.remove('over'));save()};return e}
function before(zone,x,y){return [...zone.querySelectorAll('.card:not(.dragging)')].find(e=>{let r=e.getBoundingClientRect();return y<r.top+r.height/2||(y<r.bottom&&x<r.left+r.width/2)})}
function save(){let d={};zones.forEach(z=>d[z.dataset.tier]=[...z.children].map(e=>e.dataset.song));localStorage.setItem(key,JSON.stringify(d));document.querySelector('#count').textContent=`(${pool.children.length}곡)`}
function render(data={}){zones.forEach(z=>z.replaceChildren());let used=new Set(Object.values(data).flat());zones.forEach(z=>(data[z.dataset.tier]||[]).forEach(n=>z.append(make(n))));songs.filter(n=>!used.has(n)).forEach(n=>pool.append(make(n)));save()}
function exportJpg(){const c=document.createElement('canvas'),x=c.getContext('2d'),w=1600,lw=155,px=22,rows=[];x.font='700 22px Arial';for(const z of zones.filter(z=>z.dataset.tier!=='pool')){let line=[],lines=[line],used=0;for(const e of z.children){const text=e.dataset.song,tw=Math.min(x.measureText(text).width+px*2,500);if(used+tw>w-lw-40&&line.length){line=[];lines.push(line);used=0}line.push([text,tw]);used+=tw+10}rows.push([z.dataset.tier,lines,Math.max(128,lines.length*56+34)])}const h=165+rows.reduce((n,r)=>n+r[2],0)+55;c.width=w;c.height=h;x.fillStyle='#fffaf5';x.fillRect(0,0,w,h);x.fillStyle='#1d2140';x.font='900 65px Arial';x.fillText('chuLa SONG RANKER',54,82);x.fillStyle='#ff4d84';x.font='700 25px Arial';x.fillText('MY PERSONAL TIER LIST',56,120);let y=165,colors={S:'#ff5a72',A:'#fbad50',B:'#f5d759',C:'#75c7a6',D:'#75b7e8'};for(const [tier,lines,rh] of rows){x.fillStyle='#fff';x.fillRect(0,y,w,rh);x.fillStyle=colors[tier];x.fillRect(0,y,lw,rh);x.fillStyle='#fff';x.font='900 55px Arial';x.fillText(tier,54,y+rh/2+19);let cy=y+22;for(const line of lines){let cx=lw+20;for(const [text,tw] of line){x.fillStyle='#fff3f7';x.fillRect(cx,cy,tw,38);x.fillStyle='#363651';x.font='700 20px Arial';x.fillText(text,cx+px,cy+26);cx+=tw+10}cy+=56}y+=rh}x.fillStyle='#777286';x.font='18px Arial';x.fillText('Made with chuLa Song Ranker',54,h-22);const a=document.createElement('a');a.download='chuLa_티어표.jpg';a.href=c.toDataURL('image/jpeg',.94);a.click()}
zones.forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add('over');if(!dragging)return;let b=before(z,e.clientX,e.clientY);b?z.insertBefore(dragging,b):z.append(dragging)};z.ondragleave=e=>{if(!z.contains(e.relatedTarget))z.classList.remove('over')};z.ondrop=e=>{e.preventDefault();z.classList.remove('over');save()}});
document.querySelector('#reset').onclick=()=>{localStorage.removeItem(key);render()};document.querySelector('#shuffle').onclick=()=>render({pool:[...songs].sort(()=>Math.random()-.5)});document.querySelector('#export').onclick=exportJpg;try{render(JSON.parse(localStorage.getItem(key))||{})}catch{render()}
</script></body></html>
